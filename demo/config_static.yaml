# Unified static evaluation config — math and misc domains
#
# Coding evaluation uses eval/eval_static.py --domain coding
# with its own demo/config_static_coding.yaml.
#
# Workflow:
#
#   Math:
#     python demo/sample_static.py --domain math --config demo/config_static.yaml
#     python eval/eval_static.py   --domain math --config demo/config_static.yaml
#
#   Misc:
#     python demo/sample_static.py --domain misc --config demo/config_static.yaml
#     python eval/eval_static.py   --domain misc --config demo/config_static.yaml

# ---------------------------------------------------------------------------
# Math
# ---------------------------------------------------------------------------
math:
  sampling:
    profile: paper
    seed: 0
    output_dir: results/static_eval/math
    # Datasets to sample fresh
    datasets:
      - hle-math
    # Copy these datasets verbatim from an existing run instead of re-sampling.
    # responses_file is also copied so --resume skips already-evaluated items.
    copy_from:
      file: results/static_eval/math_v0/sampled_items.jsonl
      responses_file: results/static_eval/math_v0/responses.jsonl
      datasets:
        - aime-2025
        - aime-2026
        - olympiad-math

  evaluation:
    sample_file: results/static_eval/math/sampled_items.jsonl
    judge_model: gpt-4.1-mini
    use_litellm: false
    litellm_models:
      # - gpt-5.4
      # - gpt-5-mini
      # - gpt-4.1
      # - gpt-4.1-mini
      # - claude-opus-4-6
      # - claude-sonnet-4-6
      # - claude-haiku-4-5
      # - gemini-3.1-pro
      # - gemini-2.5-pro
      # - gemini-2.5-flash
    output_dir: results/static_eval/math
    save_every: 50
    resume: true
    models:
      # - gpt-5.4
      # - gpt-5-mini
      - gpt-5.4-mini
      - gpt-5.5
      # - gpt-5.5-high
      # - gpt-4.1
      # - gpt-4.1-mini
      # - claude-opus-4-6
      - claude-opus-4-7
      # - claude-opus-4-7-thinking
      # - claude-sonnet-4-6
      # - claude-haiku-4-5
      # - gemini-3.1-pro
      # - gemini-2.5-pro
      # - gemini-2.5-flash
      # - grok-4
      # - deepseek-v3.2
      # - mistral-large-3
      # - qwen3-max-thinking
      # - llama-4-maverick-instruct
    generation_timeout: 300
    generation_max_tokens: 65536
    generation_retries: 2
    model_generation_timeouts:
      gpt-5.5-high: 300
      claude-opus-4-7-thinking: 300
    model_max_tokens:
      claude-haiku-4-5: 56000  # haiku-4-5-20251001 API cap is 64000, below the global 65536
      gpt-5-mini: ~            # null = no limit; model returns empty responses when capped
      gpt-5.4: ~               # thinking model: exhausts 16384 on hard problems
      gpt-5.4-mini: ~
      gpt-5.5: ~
      gpt-5.5-high: ~
      claude-opus-4-7-thinking: ~  # extended thinking needs uncapped headroom
      gpt-4.1: 32768
      gpt-4.1-mini: 32768
    max_workers: 4

# ---------------------------------------------------------------------------
# Misc  (HLE non-math strata + SimpleQA — 300 items)
#
# Breakdown:
#   HLE Humanities/Social Science: 90  (text-only, exactMatch, non-numeric gold)
#   HLE Other: 83                      (text-only)
#   HLE Biology/Medicine: 52           (text-only)
#   HLE Engineering: 25                (text-only)
#   SimpleQA: 50 stratified by topic
# ---------------------------------------------------------------------------
misc:
  sampling:
    seed: 0
    output_dir: results/static_eval/misc
    hle:
      humanities_social_science: 90
      other: 83
      biology_medicine: 52
      engineering: 25
    simpleqa:
      hf_path: basicv8vc/SimpleQA
      split: test
      topics:
        Science and technology: 12
        Politics: 10
        Art: 8
        Geography: 7
        History: 6
        Sports: 4
        Music: 3

  evaluation:
    sample_file: results/static_eval/misc/sampled_items.jsonl
    judge_model: gpt-5.4-mini
    use_litellm: false
    litellm_models: []
      # - gpt-5.4
      # - gpt-5-mini
      # - gpt-4.1
      # - gpt-4.1-mini
      # - claude-opus-4-6
      # - claude-sonnet-4-6
      # - claude-haiku-4-5
      # - gemini-3.1-pro
      # - gemini-2.5-pro
      # - gemini-2.5-flash
    output_dir: results/static_eval/misc
    save_every: 50
    resume: true
    models:
      # - gpt-5.4
      # - gpt-5-mini
      - gpt-5.4-mini
      - gpt-5.5
      # - gpt-5.5-high
      # - gpt-4.1
      # - gpt-4.1-mini
      # - claude-opus-4-6
      - claude-opus-4-7
      # - claude-opus-4-7-thinking
      # - claude-sonnet-4-6
      # - claude-haiku-4-5
      # - gemini-3.1-pro
      # - gemini-2.5-pro
      # - gemini-2.5-flash
      # - grok-4
      # - deepseek-v3.2
      # - mistral-large-3
      # - qwen3-max-thinking
      # - llama-4-maverick-instruct
    generation_timeout: 120
    generation_max_tokens: 65536
    generation_retries: 2
    model_generation_timeouts:
      gpt-5.5-high: 300
      claude-opus-4-7-thinking: 300
    model_max_tokens:
      claude-haiku-4-5: 56000
      gpt-5-mini: ~
      gpt-5.4: ~
      gpt-5.4-mini: ~
      gpt-5.5: ~
      gpt-5.5-high: ~
      claude-opus-4-7-thinking: ~
      gpt-4.1: 32768
      gpt-4.1-mini: 32768
    max_workers: 4
